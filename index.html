<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Glowa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&amp;family=Nunito:wght@500;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="world.css">
</head>
<body>
  <main id="stage" class="root dk" aria-label="Your wedding plot">
    <div aria-hidden="true" class="cloud" style="top: 70px; width: 220px; height: 60px; animation-delay: -18s"></div>
    <div aria-hidden="true" class="cloud" style="top: 210px; width: 150px; height: 44px; animation-delay: -64s"></div>
    <div aria-hidden="true" class="cloud" style="top: 130px; width: 280px; height: 70px; animation-delay: -95s"></div>
    <div aria-hidden="true" class="hill hill-a"></div>
    <div aria-hidden="true" class="hill hill-b"></div>

    <div id="cam">
      <div id="world">
        <div aria-hidden="true" class="plot-shadow"></div>
        <div aria-hidden="true" class="plot-earth"></div>
        <div aria-hidden="true" class="plot-grass">
          <div class="steps"></div>
          <div class="path"></div>
          <div class="plaza"></div>
          <div class="pond"></div>
          <div class="bed bed-a"></div>
          <div class="bed bed-b"></div>
          <div class="bed bed-c"></div>
          <div class="lot" style="left: 458px; top: 236px; width: 92px; height: 88px"></div>
          <div class="lot" style="left: 252px; top: 42px; width: 112px; height: 86px"></div>
          <div class="lot" style="left: 50px; top: 190px; width: 68px; height: 68px"></div>
        </div>
        <div aria-hidden="true" class="fly" style="left: 330px; top: 250px"></div>
        <div aria-hidden="true" class="fly" style="left: 520px; top: 330px; animation-delay: -4s; background: #E4577A"></div>
        <div id="things"></div>
        <div id="crowd"></div>
      </div>
      <div id="marks"></div>
    </div>

    <header class="hud">
      <div class="hud-left">
        <div class="logo">Glowa</div>
        <button type="button" id="count-chip" class="hud-chip">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#2B2140" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.5 L10 7 L18 4.5 V15 L10 17.5 L2 15 Z"></path><path d="M10 7 V17.5"></path></svg>
          <span id="count-label">No guests yet</span>
        </button>
      </div>
      <div id="bench-box" class="hud-box" role="status" hidden></div>
    </header>

    <nav class="cam-tools" aria-label="View">
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" aria-label="Zoom out">&minus;</button>
      <button type="button" id="recentre" aria-label="Centre the plot">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#2B2140" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="4"></circle><path d="M10 1 V5 M10 15 V19 M1 10 H5 M15 10 H19"></path></svg>
      </button>
    </nav>
    <a class="classic-link" href="classic.html">Classic planner</a>

    <div id="toast" class="toast" role="status" hidden>
      <div class="toast-text"><span id="toast-title" class="toast-title"></span><span id="toast-body" class="toast-body"></span></div>
      <button type="button" class="soon" disabled>Quest coming later</button>
      <button type="button" id="toast-close" class="icon-btn plain" aria-label="Dismiss">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2B2140" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M3 3 L13 13 M13 3 L3 13"></path></svg>
      </button>
    </div>

    <section id="guestbook" class="panel" role="dialog" aria-labelledby="guestbook-title" hidden>
      <div class="panel-head">
        <div class="panel-titles">
          <h2 id="guestbook-title" tabindex="-1">The Guestbook</h2>
          <span class="sub">Bring your real list. Everyone on it walks in.</span>
        </div>
        <button type="button" id="guestbook-close" class="icon-btn" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2B2140" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M3 3 L13 13 M13 3 L3 13"></path></svg>
        </button>
      </div>
      <div class="note" role="status">This is the new entrance, still being built. Importing a list, the sample list and adding by hand switch on in the next step. Nothing is uploaded or saved from here yet.</div>
      <label class="drop is-off">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#2B2140" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 19 V5 M8 11 L14 5 L20 11 M4 20 V23 H24 V20"></path></svg>
        <span class="drop-title">Drop a CSV or Excel file</span>
        <span class="sub">Any column names. You match them next.</span>
        <input type="file" accept=".csv,.xlsx,.xls" disabled>
      </label>
      <button type="button" class="wide" disabled>Use the sample list (120 guests)</button>
      <div class="by-hand">
        <label for="glowa-add">Or add a guest by hand</label>
        <div class="by-hand-row">
          <input id="glowa-add" type="text" placeholder="Full name" disabled>
          <button type="button" disabled>Add</button>
        </div>
        <span class="sub">They walk in with everyone else.</span>
      </div>
      <button type="button" class="go" disabled>Open the gates</button>
    </section>
  </main>

  <script src="world-core.js"></script>
  <script src="world.js"></script>
</body>
</html>

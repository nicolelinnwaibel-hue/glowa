<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Glowa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&amp;family=Nunito:wght@500;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="world.css">
</head>
<body>
  <main id="stage" class="root dk" aria-label="Your wedding plot">
    <div aria-hidden="true" class="cloud" style="top: 70px; width: 220px; height: 60px; animation-delay: -18s"></div>
    <div aria-hidden="true" class="cloud" style="top: 210px; width: 150px; height: 44px; animation-delay: -64s"></div>
    <div aria-hidden="true" class="cloud" style="top: 130px; width: 280px; height: 70px; animation-delay: -95s"></div>
    <div aria-hidden="true" class="hill hill-a"></div>
    <div aria-hidden="true" class="hill hill-b"></div>

    <div id="cam">
      <div id="world">
        <div aria-hidden="true" class="plot-shadow"></div>
        <div aria-hidden="true" class="plot-earth"></div>
        <div aria-hidden="true" class="plot-grass">
          <div class="steps"></div>
          <div class="path"></div>
          <div class="plaza"></div>
          <div class="pond"></div>
          <div class="bed bed-a"></div>
          <div class="bed bed-b"></div>
          <div class="bed bed-c"></div>
          <div class="lot" style="left: 458px; top: 236px; width: 92px; height: 88px"></div>
          <div class="lot" style="left: 252px; top: 42px; width: 112px; height: 86px"></div>
          <div class="lot" style="left: 50px; top: 190px; width: 68px; height: 68px"></div>
        </div>
        <div aria-hidden="true" class="fly" style="left: 330px; top: 250px"></div>
        <div aria-hidden="true" class="fly" style="left: 520px; top: 330px; animation-delay: -4s; background: #E4577A"></div>
        <div class="bench-island" aria-hidden="true">
          <svg width="240" height="84" viewBox="0 0 240 84">
            <ellipse cx="120" cy="66" rx="118" ry="17" fill="#8C6047" stroke="#2B2140" stroke-width="3"></ellipse>
            <ellipse cx="120" cy="58" rx="116" ry="17" fill="#C9C2EA" stroke="#2B2140" stroke-width="3"></ellipse>
            <rect x="56" y="22" width="128" height="9" rx="3" fill="#C9925E" stroke="#2B2140" stroke-width="2.5"></rect>
            <rect x="64" y="31" width="5" height="16" fill="#8A5A3C" stroke="#2B2140" stroke-width="2"></rect>
            <rect x="171" y="31" width="5" height="16" fill="#8A5A3C" stroke="#2B2140" stroke-width="2"></rect>
            <rect x="8" y="30" width="6" height="30" rx="2" fill="#F6BE4A" stroke="#2B2140" stroke-width="2"></rect>
            <rect x="226" y="30" width="6" height="30" rx="2" fill="#F6BE4A" stroke="#2B2140" stroke-width="2"></rect>
            <path d="M11 34 Q66 52 120 36 Q174 52 229 34" fill="none" stroke="#B5345A" stroke-width="4" stroke-linecap="round"></path>
          </svg>
          <span class="bench-sign">The maybe list</span>
        </div>
        <div id="scenery" aria-hidden="true"></div>
        <div id="things"></div>
        <button type="button" id="you" class="obj you" aria-label="You. Choose your dress" style="left: 470px; top: 312px; z-index: 312; width: 40px; height: 56px">
          <span class="you-in"><span class="you-veil"></span><span class="you-dress"></span><span class="you-head"></span><span class="you-hair"></span><span class="you-sparkle"></span></span>
          <span class="you-tag">You</span>
        </button>
        <div id="crowd"></div>
      </div>
      <div id="marks"></div>
    </div>

    <header class="hud">
      <div class="hud-left">
        <div class="logo">Glowa</div>
        <button type="button" id="count-chip" class="hud-chip">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#2B2140" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.5 L10 7 L18 4.5 V15 L10 17.5 L2 15 Z"></path><path d="M10 7 V17.5"></path></svg>
          <span id="count-label">No guests yet</span>
        </button>
        <button type="button" id="dress-chip" class="hud-chip">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#2B2140" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M7 2 L10 5 L13 2 L13 7 Q16 12 18 18 H2 Q4 12 7 7 Z"></path></svg>
          <span id="dress-label">Pick your dress</span>
        </button>
        <button type="button" id="venue-chip" class="hud-chip">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#2B2140" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 18 V8 H6 V5 H8 V8 H12 V5 H14 V8 H17 V18 Z"></path><path d="M8.5 18 V14 Q10 12 11.5 14 V18"></path></svg>
          <span id="venue-label">Pick your venue</span>
        </button>
      </div>
      <div id="mood" class="mood" hidden>
        <svg width="26" height="24" viewBox="0 0 26 24" aria-hidden="true"><path d="M13 22 C4 15 2 11 2 7.5 A5.5 5.5 0 0 1 13 6 A5.5 5.5 0 0 1 24 7.5 C24 11 22 15 13 22 Z" fill="#E4577A" stroke="#2B2140" stroke-width="2.5" stroke-linejoin="round"></path></svg>
        <div class="mood-body">
          <div class="mood-top"><span class="mood-title">Guest mood</span><span id="mood-label" class="mood-label"></span></div>
          <div id="mood-bar" class="mood-bar" role="img"><div id="mood-fill"></div></div>
          <span id="mood-cause" class="mood-cause"></span>
        </div>
        <div class="mood-buttons">
          <button type="button" id="mood-pause" class="icon-btn" aria-label="Pause the party" aria-pressed="false"></button>
          <button type="button" id="mood-snacks" class="snacks">Serve snacks</button>
        </div>
      </div>
      <div id="bench-box" class="hud-box" role="status" hidden></div>
    </header>

    <div id="arrival" class="banner" hidden>
      <div class="banner-pill">
        <span id="arrival-text" role="status" aria-live="polite"></span>
        <button type="button" id="arrival-skip">Skip</button>
      </div>
    </div>

    <nav class="cam-tools" aria-label="View">
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" aria-label="Zoom out">&minus;</button>
      <button type="button" id="recentre" aria-label="Centre the plot">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#2B2140" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="4"></circle><path d="M10 1 V5 M10 15 V19 M1 10 H5 M15 10 H19"></path></svg>
      </button>
    </nav>
    <a class="classic-link" href="classic.html">Classic planner</a>

    <div id="toast" class="toast" role="status" hidden>
      <div class="toast-text"><span id="toast-title" class="toast-title"></span><span id="toast-body" class="toast-body"></span></div>
      <button type="button" id="toast-soon" class="soon" disabled>Quest coming later</button>
      <button type="button" id="toast-action" class="toast-action" hidden></button>
      <button type="button" id="toast-close" class="icon-btn plain" aria-label="Dismiss">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2B2140" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M3 3 L13 13 M13 3 L3 13"></path></svg>
      </button>
    </div>

    <section id="dress-panel" class="panel" role="dialog" aria-labelledby="dress-title" hidden>
      <div class="panel-head">
        <div class="panel-titles">
          <h2 id="dress-title" tabindex="-1">Your dress</h2>
          <span class="sub">Pick a style and you'll be wearing it on the plot.</span>
        </div>
        <button type="button" id="dress-close" class="icon-btn" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2B2140" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M3 3 L13 13 M13 3 L3 13"></path></svg>
        </button>
      </div>
      <div id="dress-body" class="panel-body"></div>
    </section>

    <section id="venue-panel" class="panel" role="dialog" aria-labelledby="venue-title" hidden>
      <div class="panel-head">
        <div class="panel-titles">
          <h2 id="venue-title" tabindex="-1">Your venue</h2>
          <span class="sub">Pick the kind of place, then when. Finalise when you've decided.</span>
        </div>
        <button type="button" id="venue-close" class="icon-btn" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2B2140" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M3 3 L13 13 M13 3 L3 13"></path></svg>
        </button>
      </div>
      <div id="venue-body" class="panel-body"></div>
    </section>

    <section id="guestbook" class="panel" role="dialog" aria-labelledby="guestbook-title" hidden>
      <div class="panel-head">
        <div class="panel-titles">
          <h2 id="guestbook-title" tabindex="-1">The Guestbook</h2>
          <span class="sub" id="guestbook-sub">Bring your real list. Everyone on it walks in.</span>
        </div>
        <button type="button" id="guestbook-close" class="icon-btn" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2B2140" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M3 3 L13 13 M13 3 L3 13"></path></svg>
        </button>
      </div>
      <div id="guestbook-body" class="panel-body"></div>
    </section>
  </main>

  <script src="world-core.js"></script>
  <script src="guests-core.js"></script>
  <script src="xlsx-lite.js"></script>
  <script src="world.js"></script>
  <script src="guestbook.js"></script>
  <script src="game.js"></script>
  <script src="venue-core.js"></script>
  <script src="venue.js"></script>
  <script src="dress-core.js"></script>
  <script src="dress.js"></script>
</body>
</html>
